trading:
  symbol: "BTC/USDT"
  timeframe: "15m"
  leverage: 1

strategy:
  # Consolidation detection
  consolidation_period: 20        # bars to look back for consolidation
  consolidation_atr_mult: 0.5     # ATR multiplier — tight if range < mult * ATR
  squeeze_bb_period: 20           # Bollinger Band period for squeeze detection
  squeeze_bb_std: 2.0             # BB standard deviation
  squeeze_kc_mult: 1.5            # Keltner Channel multiplier for squeeze

  # Momentum acceleration
  roc_fast: 5                     # fast Rate-of-Change period
  roc_slow: 14                    # slow Rate-of-Change period
  accel_threshold: 0.0            # fast ROC must exceed slow ROC by this amount

  # Breakout confirmation
  breakout_bars: 2                # bars price must close outside consolidation range
  volume_mult: 1.3                # breakout volume must be > mult * avg volume

risk:
  risk_per_trade: 0.01            # 1% of account per trade
  reward_risk_ratio: 2.0          # take profit at 2× the risk
  max_open_trades: 3
  trailing_stop: false
  trailing_stop_pct: 0.005        # 0.5% trailing distance if enabled

backtest:
  start_date: "2024-01-01"
  end_date: "2025-01-01"
  initial_capital: 10000.0
  commission: 0.001               # 0.1% taker fee
